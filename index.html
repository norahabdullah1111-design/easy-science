        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        * {
            font-family: 'Tajawal', sans-serif;
        }

        .animate-star {
            animation: starPulse 0.6s ease-in-out;
        }

        @keyframes starPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .certificate-pattern {
            background-image:
                linear-gradient(45deg, rgba(93, 92, 222, 0.05) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(93, 92, 222, 0.05) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(93, 92, 222, 0.05) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(93, 92, 222, 0.05) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(93, 92, 222, 0.2);
        }

        .progress-bar {
            transition: width 0.5s ease;
        }

        .dark {
            color-scheme: dark;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .dark ::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        ::-webkit-scrollbar-thumb {
            background: #5D5CDE;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a49b8;
        }

        .chat-bubble {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>

        function selectAnswer(selectedIndex, selectedBtn) {

            const buttons = document.querySelectorAll('#optionsContainer button');

                    btn.classList.add('bg-red-500', 'text-white', 'border-red-500');

                role === 'user'
                    ? 'bg-purple-600 text-white'
                    : 'bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white'

            if (role === 'ai' && !isComplete) {

                bubble.innerHTML = marked.parse(content);

            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            return div;

        function updateChatMessage(role, content, isComplete) {
            const container = document.getElementById('chatMessages');
            const lastMessage = container.lastElementChild;

            if (lastMessage && lastMessage.classList.contains('text-left')) {
                const bubble = lastMessage.querySelector('div');
                if (bubble) {

                        bubble.innerHTML = marked.parse(content) + ' <span class="animate-pulse">▋</span>';

            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            addChatMessage('user', message, true);
            input.value = '';

            addChatMessage('ai', 'جارٍ التفكير...', false);

            if (window.Poe) {
                try {
                    await window.Poe.sendUserMessage(
                        `@Claude-Sonnet-4.5 أنت مساعد تعليمي للعلوم في المرحلة المتوسطة السعودية. أجب على السؤال التالي بشكل واضح ومبسط:\n\n${message}`,
                        {
                            handler: 'chat-handler',
                            stream: true,
                            openChat: false
                        }
                    );
                } catch (err) {
                    addChatMessage('ai', 'عذراً، حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.', true);
                }
            } else {
                setTimeout(() => {
                    const container = document.getElementById('chatMessages');
                    container.removeChild(container.lastElementChild);
                    addChatMessage('ai', 'عذراً، المساعد الذكي غير متاح حالياً. هذا التطبيق يعمل بشكل أفضل على منصة Poe.', true);
                }, 500);
            }
        }

        document.getElementById('sendChatBtn').addEventListener('click', sendChatMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        });

        // Initialize
        loadProgress();
        if (userData) {
            showMainApp();
        }
    </script>
</body>
</html>
